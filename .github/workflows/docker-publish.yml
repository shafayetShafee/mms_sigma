name: Docker

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag without the leading v (e.g. 1.0.0)'
        required: true

# Default to read-only for every job; jobs that need more ask for it explicitly.
permissions:
  contents: read

# Never run two publishes for the same ref at once, and don't cancel a
# publish that is already in progress (a half-pushed release is worse).
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Computes the image name and version once, so the build and merge jobs
  # share the same values instead of duplicating (and possibly diverging) logic.
  prepare:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Compute image name and version
        id: meta
        env:
          # User-controlled input is passed through env, never interpolated
          # directly into the script, to prevent shell injection.
          VERSION_INPUT: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # GHCR requires lowercase image names.
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${VERSION_INPUT#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Fail early if the version isn't a valid semver-style string
          # (also guarantees it is safe to use as a Docker tag).
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected e.g. 1.0.0 or 1.0.0-rc.1)"
            exit 1
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm   # native arm64 runner; free for public repos only

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # the build doesn't need git credentials

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (platform-specific tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # Without this, each per-arch tag becomes an index with an extra
          # "unknown/unknown" attestation entry, which then pollutes the
          # merged multi-arch manifest.
          provenance: false
          # Links the package to this repository on GHCR.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer cache, scoped per platform so amd64 and arm64 don't clobber
          # each other. Saves the slow renv::restore() layer on rebuilds.
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.slug }}

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          TAGS=(--tag "${IMAGE}:${VERSION}")

          # Only a real tag push moves `latest`; a manual dispatch
          # (possibly of an old version) shouldn't.
          if [ "$EVENT_NAME" = "push" ]; then
            TAGS+=(--tag "${IMAGE}:latest")
          fi

          docker buildx imagetools create "${TAGS[@]}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
